<section class="profile-page">
	<header class="page-header">
		<div>
			<p class="eyebrow">Account</p>
			<h2>Profile settings</h2>
			<p>Update the information used across your KnowFlow account.</p>
		</div>
	</header>

	<p *ngIf="loading">Loading profile...</p>
	<p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>
	<p *ngIf="successMessage" class="message success">{{ successMessage }}</p>

	<form *ngIf="!loading" [formGroup]="profileForm" (ngSubmit)="save()">
		<div class="profile-layout">
			<div class="avatar-panel">
				<div class="avatar" [class.has-image]="imagePreview">
					  <img *ngIf="imagePreview" [src]="imagePreview" alt="Profile" />
					<span *ngIf="!imagePreview">Photo</span>
				</div>
				<label class="upload-button">
					Change photo
					<input type="file" accept="image/*" (change)="onImageSelected($event)" />
				</label>
				<small>PNG, JPG or WEBP. Maximum 5 MB.</small>
			</div>

			<div class="form-panel">
				<div class="field-row">
					<label>First name<input formControlName="name" /></label>
					<label>Family name<input formControlName="familyName" /></label>
				</div>
				<label>Email<input type="email" formControlName="email" /></label>
				<label>Phone number<input formControlName="phoneNumber" /></label>
				<label>Address<textarea formControlName="address" rows="3"></textarea></label>
				<button type="submit" [disabled]="saving">
					{{ saving ? 'Saving...' : 'Save changes' }}
				</button>
			</div>
		</div>
	</form>
</section>
