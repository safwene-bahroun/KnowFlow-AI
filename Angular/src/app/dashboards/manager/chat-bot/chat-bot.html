<div class="chat-layout">
  <!-- CHAT AREA -->
  <div class="chat-container">

    <!-- HEADER -->
    <div class="chat-header">
      <div class="chat-title">
        <div class="bot-icon">🤖</div>
        <div>
          <h2>KnowFlow AI</h2>
          <span>AI Document Assistant</span>
        </div>
      </div>
      <button
        type="button"
        class="new-chat-btn"
        (click)="newConversation()"
      >
        + New Chat
      </button>
    </div>


    <!-- MESSAGES -->
    <div
      id="messagesContainer"
      class="messages-container"
    >

      <!-- Welcome Screen -->
      <div
        class="welcome"
        *ngIf="messages.length === 0 && !loading"
      >
        <div class="welcome-icon">🤖</div>
        <h2>How can I help you?</h2>
        <p>Ask questions about documents you are authorized to access.</p>

        <div class="suggestions">
          <button
            type="button"
            (click)="question = 'What documents can I access?'"
          >
            📄 What documents can I access?
          </button>
          <button
            type="button"
            (click)="question = 'Summarize my available documents'"
          >
            📋 Summarize my documents
          </button>
          <button
            type="button"
            (click)="question = 'What is the company policy?'"
          >
            📋 What is the company policy?
          </button>
          <button
            type="button"
            (click)="question = 'How do I search for information in documents?'"
          >
            🔍 How do I search for information?
          </button>
        </div>
      </div>


      <!-- Chat Messages -->
      <div
        class="message-row user-message"
        *ngFor="let message of messages; let i = index"
        [class.assistant-message]="message.role === 'AI'"
      >
        <!-- AI Avatar -->
        <div
          class="message-avatar ai-avatar"
          *ngIf="message.role === 'AI'"
        >AI</div>

        <!-- Bubble -->
        <div class="message-bubble">
          <div class="message-content">
            {{ message.content }}
          </div>
        </div>

        <!-- User Avatar -->
        <div
          class="message-avatar user-avatar"
          *ngIf="message.role === 'USER'"
        >
          <img
            *ngIf="userImage"
            [src]="userImage"
            alt="Profile"
            (error)="userImage = ''"
          />
          <span
            class="user-initial"
            *ngIf="!userImage"
          >{{ userInitial }}</span>
        </div>
      </div>


      <!-- Typing Indicator -->
      <div
        class="typing-row assistant-message"
        *ngIf="showTyping"
      >
        <div class="message-avatar">🤖</div>
        <div class="typing-bubble">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

    </div>


    <!-- Error -->
    <div
      class="chat-error"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>


   <!-- Input Area -->
<div class="chat-input-container">
  <textarea
    [(ngModel)]="question"
    (keydown)="onEnter($event)"
    (input)="autoGrow($event)"
    placeholder="Ask something about your documents..."
    rows="1"
    [disabled]="loading"
  ></textarea>

  <button
    type="button"
    class="send-btn"
    (click)="sendMessage()"
    [disabled]="loading || !question.trim()"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="22" y1="2" x2="11" y2="13" />
      <polygon points="22 2 15 22 11 13 2 9 22 2" />
    </svg>
  </button>
</div>


    <!-- Footer -->
    <div class="chat-footer">
      AI answers are generated only from documents
      you are authorized to access.
    </div>

  </div>

</div>
