<div class="department-container">

  <h2>Departments</h2>

  <!-- Messages -->

  <div
    *ngIf="successMessage"
    class="success-message"
  >
    {{ successMessage }}
  </div>

  <div
    *ngIf="errorMessage"
    class="error-message"
  >
    {{ errorMessage }}
  </div>


  <!-- ========================= -->
  <!-- SEARCH -->
  <!-- ========================= -->

  <div class="search-container">

    <input
      type="text"
      placeholder="Search department..."
      [(ngModel)]="searchKeyword"
      (keyup.enter)="searchDepartments()"
    />

    <button
      type="button"
      (click)="searchDepartments()"
    >
      Search
    </button>

    <button
      type="button"
      (click)="loadDepartments()"
    >
      Reset
    </button>

  </div>


  <!-- ========================= -->
  <!-- FORM -->
  <!-- ========================= -->

  <div class="department-form">

    <h3>
      {{ isEditing
        ? 'Edit Department'
        : 'Create Department'
      }}
    </h3>

    <form
      [formGroup]="departmentForm"
      (ngSubmit)="
        isEditing
          ? updateDepartment()
          : createDepartment()
      "
    >

      <!-- NAME -->

      <div class="form-group">

        <label for="name">
          Department Name
        </label>

        <input
          id="name"
          type="text"
          formControlName="name"
        />

        <small
          *ngIf="
            nameControl.invalid &&
            nameControl.touched
          "
        >
          Department name is required.
        </small>

      </div>


      <!-- DESCRIPTION -->

      <div class="form-group">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          formControlName="description"
          rows="4"
        ></textarea>

      </div>


      <!-- BUTTONS -->

      <button
        type="submit"
        [disabled]="departmentForm.invalid"
      >
        {{ isEditing ? 'Update' : 'Create' }}
      </button>

      <button
        *ngIf="isEditing"
        type="button"
        (click)="resetForm()"
      >
        Cancel
      </button>

    </form>

  </div>


  <!-- ========================= -->
  <!-- DEPARTMENTS TABLE -->
  <!-- ========================= -->

  <div class="department-list">

    <h3>Department List</h3>

    <table
      *ngIf="
        !isLoading &&
        departments.length > 0
      "
    >

      <thead>

        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="
            let department of departments
          "
        >

          <td>
            {{ department.id }}
          </td>

          <td>
            {{ department.name }}
          </td>

          <td>
            {{ department.description || '-' }}
          </td>

          <td>

            <button
              type="button"
              (click)="
                editDepartment(department)
              "
            >
              Edit
            </button>

            <button
              type="button"
              (click)="
                deleteDepartment(department.id)
              "
            >
              Delete
            </button>

          </td>

        </tr>

      </tbody>

    </table>


    <p
      *ngIf="
        !isLoading &&
        departments.length === 0
      "
    >
      No departments found.
    </p>

  </div>

</div>
