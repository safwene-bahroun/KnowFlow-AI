<div class="auth-container">
  <div class="back-btn-wrapper">
<button routerLink="/Home">❮❮❮❮  Back </button>
  </div>
  <div class="auth-card">

    <h1>Reset Password</h1>

    <p>
      Enter your new password.
    </p>

    <form
      [formGroup]="resetForm"
      (ngSubmit)="resetPassword()"
    >

      <div class="form-group">

        <label>New password</label>

        <div class="password-field">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="Min 6 characters, upper/lowercase, number, symbol"
        >
        <button type="button" class="password-toggle" (click)="togglePasswordVisibility('password')">{{ passwordVisible ? 'Hide' : 'Show' }}</button>
        </div>

        <small
          class="error"
          *ngIf="
            resetForm.get('password')?.touched &&
            resetForm.get('password')?.invalid
          "
        >
          Password must contain at least 6 characters,
          uppercase, lowercase, number and special character.
        </small>

      </div>


      <div class="form-group">

        <label>Confirm password</label>

        <div class="password-field">
        <input
          [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm password"
        >
        <button type="button" class="password-toggle" (click)="togglePasswordVisibility('confirmPassword')">{{ confirmPasswordVisible ? 'Hide' : 'Show' }}</button>
        </div>
        <small class="error" *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('passwordsMismatch')">Passwords do not match.</small>

      </div>


      <div
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <div
        class="success"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>


      <button
        type="submit"
        [disabled]="resetForm.invalid || loading"
      >

        {{
          loading
            ? 'Resetting...'
            : 'Reset password'
        }}

      </button>

    </form>

  </div>

</div>
