<div class="auth-container">
<button routerLink="/login">❮❮❮❮  Back </button>
  <div class="auth-card">

    <h1>Forgot Password?</h1>

    <p>
      Enter your email and we will send you a password reset link.
    </p>

    <form
      [formGroup]="forgotForm"
      (ngSubmit)="forgotPassword()"
    >

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        >

        <small
          class="error"
          *ngIf="
            forgotForm.get('email')?.touched &&
            forgotForm.get('email')?.invalid
          "
        >
          Please enter a valid email.
        </small>

      </div>


      <div
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <div
        class="success"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>


      <button
        type="submit"
        [disabled]="forgotForm.invalid || loading"
      >

        {{
          loading
            ? 'Sending...'
            : 'Send reset link'
        }}

      </button>

    </form>


    <a routerLink="/login">
      Back to login
    </a>

  </div>

</div>
