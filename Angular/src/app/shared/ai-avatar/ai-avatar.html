<div class="avatar" [class]="state + ' ' + size" role="img" [attr.aria-label]="'AI assistant ' + state">
  <div class="pulse pulse-one"></div>
  <div class="pulse pulse-two"></div>
  <div class="orbit orbit-one"><span></span><span></span><span></span></div>
  <div class="orbit orbit-two"><span></span><span></span></div>
  <div class="core">
    <div class="network">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="core-dot"></div>
    <div class="status-mark success-mark">&#10003;</div>
    <div class="status-mark error-mark">&#10005;</div>
  </div>
  <div class="listening-bars"><i></i><i></i><i></i></div>
</div>
