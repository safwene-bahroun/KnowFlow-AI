# ===============================
# PostgreSQL Database Configuration
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/knowflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
app.upload.dir=images
app.file.upload.dir=files

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Server
# ===============================

server.port=3000

# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# 900000 ms = 15 minutes

# =====================================================
# FRONTEND
# =====================================================

app.frontend-url=http://localhost:4200

# =====================================================
# MAIL
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=knowflowai.project@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
flask.rag.url=http://localhost:5001/api/rag/query

internal.api.key=KNOWFLOW_SECRET_KEY