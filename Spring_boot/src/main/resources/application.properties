# ===============================
# PostgreSQL Database Configuration
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/knowflow
spring.datasource.username=postgres
spring.datasource.password=123456

spring.datasource.driver-class-name=org.postgresql.Driver
app.upload.dir=images

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Server
# ===============================

server.port=3000

# =====================================================
# JWT
# =====================================================

jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARACTERS
jwt.expiration=900000

# 900000 ms = 15 minutes


# =====================================================
# FRONTEND
# =====================================================

app.frontend-url=http://localhost:4200


# =====================================================
# MAIL
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=knowflowai.project@gmail.com
spring.mail.password=Safwene2002

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true